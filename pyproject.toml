[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-deepseek-harness-python"
dynamic = ["version"]
description = "从 0 到 1 复现 DeepSeek Harness 核心能力的教学实现（成熟开源库优先）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent", "deepseek", "harness", "event-sourcing", "llm", "education"]
dependencies = ["httpx>=0.27", "filelock>=3.13", "watchdog>=4.0", "pillow>=10.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
miniharness = "miniharness.cli:main"

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["miniharness*"]

[tool.setuptools.dynamic]
version = { attr = "miniharness.__version__" }
