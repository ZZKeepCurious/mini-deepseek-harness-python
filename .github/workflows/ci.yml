name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install httpx pyyaml filelock watchdog coverage fastapi uvicorn
      - name: Compile all sources
        run: python -m compileall -q miniharness tests examples
      - name: Run unit tests with coverage
        run: python -m coverage run --source=miniharness -m unittest discover -s tests -t .
      - name: Coverage gate
        run: python -m coverage report --fail-under=85
      - name: Demo smoke test
        run: python -m miniharness.demo