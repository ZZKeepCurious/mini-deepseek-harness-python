name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e .[yaml,web] coverage
      - name: Compile all sources
        run: python -m compileall -q miniharness tests examples
      - name: Run unit tests with coverage
        env:
          # windows-acl 真内核 e2e（tests/test_windows_acl_e2e.py）仅在真实
          # win32 宿主 + 此环境变量门控下运行；CI 只在 windows-latest 腿开启，
          # ubuntu 腿保持跳过（fail-closed 行为由单元测试覆盖）。
          MINIHARNESS_INTEGRATION_WINDOWS_ACL: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python -m coverage run --source=miniharness -m unittest discover -s tests -t .
      - name: Coverage gate
        run: python -m coverage report --fail-under=85
      - name: Demo smoke test
        run: python -m miniharness.demo